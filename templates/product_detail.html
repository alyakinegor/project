{% extends 'includes/menu.html' %}

{% block content %}
    <div class="flex flex-row p-6">
        <div class="flex flex-col items-center">
            <img src="{{ product.image.url }}" class="w-[450px] h-[350px]">
            <span class="flex flex-row gap-15 items-center mt-10">
                <p class="text-4xl">{{ product.price|stringformat:"i"|slice:":-3" }} {{ product.price|stringformat:"i"|slice:"-3:" }}₽</p>
                {% csrf_token %}
                <button class="bg-black p-[6px] pr-[10px] pl-[10px] pb-[8px] rounded-xl text-white" id="btn" data-id="{{ product.id }}">В корзину</button>
            </span>
        </div>
        <div>
            <div class="flex flex-col items-center">
                <p class="font-semibold text-xl">Описание</p>
                <p class="w-[500px] text-[#666666] ml-10 text-sm/6">{{ product.description }}</p>
            </div>
        </div>
        <script>
            const button = document.querySelector('#btn');
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

                fetch('/add/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json',
                            'X-CSRFToken': csrf},
                    body: JSON.stringify({'product_id': id})
                }).then(response => response.json())
                .then(data => {
                    if (data.status === 'ok'){
                        button.innerText = 'В корзине'
                    }
                }).catch(error => console.log('Ошибка', error))

            })
        </script>
    </div>

{% endblock %}
